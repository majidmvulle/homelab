# DNS source-of-truth seed inventory.
#
# Purpose:
# - capture the current authoritative record set for homelab.internal
# - separate repo-known records from Pi-hole-only records that still need export
# - provide a concrete target for Unbound host overrides later
#
# Rules:
# - do not change live DNS from this file directly
# - do not assume values for records marked verify_from_pihole_export
# - update this file first, then stage Unbound/AdGuard changes from it

metadata:
  domain: homelab.internal
  current_dns_backend: opnsense-unbound
  teleporter_archive: pi-hole_rpi03_teleporter_2026-06-22_14-42-46__04.zip
  target_dns_stack:
    frontend: adguard-home
    local_authority: unbound
  current_edge_ingress_ip: 10.0.0.18
  notes:
    - the seed inventory was reconstructed from the Pi-hole Teleporter export
    - live client-facing DNS now resolves through OPNsense Unbound
    - planned dynamic app record updates target OPNsense Bind via RFC2136
    - records behind Traefik are seeded from Git and should resolve to the current ingress IP
    - Pi-hole Teleporter export confirmed that local DNS is implemented as A-style hosts entries in pihole.toml
    - Pi-hole Teleporter export confirmed there are no configured local CNAME records
    - switch01 and ap01 do not appear in the Teleporter local DNS export and must be verified separately before cutover
    - for OPNsense Unbound, the documented UI path is host overrides plus aliases, not literal CNAME entries

