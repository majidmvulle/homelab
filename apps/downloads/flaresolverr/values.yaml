image:
  repository: ghcr.io/flaresolverr/flaresolverr
  tag: "v3.5.2"
service:
  type: ClusterIP
  port: 8191
  targetPort: 8191
env:
  LOG_LEVEL: error
  LOG_HTML: false
  CAPTCHA_SOLVER: ""
  TZ: "Asia/Dubai"
resources:
  limits:
    cpu: "200m"
    memory: "512Mi"
  requests:
    cpu: "50m"
    memory: "128Mi"
