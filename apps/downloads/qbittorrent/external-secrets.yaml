# --- Syncs the Mullvad WireGuard config to a ConfigMap for qBittorrent ---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-wireguard-config
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  # This defines the resource that will be created in the 'downloads' namespace
  target:
    # This name MUST match what qBittorrent's values.yaml expects
    name: mullvad-config-ch-zrh-002
    creationPolicy: Owner

  dataFrom:
  - extract:
      key: mullvad-config-ch-zrh-002
