image:
  repository: linuxserver/lidarr
  tag: "nightly-version-3.1.2.4939"
deploymentStrategy:
  type: Recreate
env:
  TZ: "Asia/Dubai"
  PUID: 1000
  PGID: 1000
service:
  type: ClusterIP
  port: 8686
ingress:
  enabled: true
  host: lidarr.homelab.internal
persistence:
  config:
    storageClass: "longhorn-persistent"
    size: 5Gi
  media:
    storageClass: "longhorn-persistent-rwx"
    size: 100Gi
  downloads:
    size: 50Gi
    nfs:
      path: /volume1/k3s/data/downloads
      server: synology01.homelab.internal
resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi
podSecurityContext:
  fsGroup: 1000
