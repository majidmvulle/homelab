apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mailpit-smtp
  namespace: notifications
spec:
  secretName: mailpit-smtp-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  commonName: mailpit.homelab.internal
  duration: 8760h
  renewBefore: 720h
  dnsNames:
    - mailpit.homelab.internal
    - mailpit.notifications.svc.cluster.local
    - mailpit.notifications.svc
    - mailpit.notifications
  privateKey:
    algorithm: RSA
    size: 2048
