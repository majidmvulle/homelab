image:
  tag: "0.26.2"
deploymentStrategy:
  type: Recreate

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  runAsNonRoot: true

securityContext:
  runAsUser: 1000
  runAsGroup: 3000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

ingress:
  host: affine.homelab.internal
  annotations:
    external-dns.alpha.kubernetes.io/hostname: affine.homelab.internal

persistence:
  storageClass: longhorn-persistent

redis:
  host: valkey-haproxy.cache.svc.cluster.local
  port: 6379
  dbIndex: 0

config:
  flags:
    allowGuestDemoWorkspace: false

mailer:
  existingSecretName: mailpit-secrets
  caCert:
    enabled: true
    secretKey: ca.crt
