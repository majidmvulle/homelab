replicaCount: 2

image:
  repository: haproxy
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: "haproxy"
fullnameOverride: "haproxy"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  host: haproxy.homelab.internal

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  global: |
    global
        log stdout format raw local0 info
        maxconn 256
        # Necessary for running as non-root in newer images if needed
        # user haproxy
        # group haproxy
        # stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners
        # daemon # Run in foreground for containers

  defaults: |
    defaults
        log global
        mode http
        option httplog
        option dontlognull
        option log-health-checks
        timeout connect 5000ms
        timeout client 50000ms
        timeout server 50000ms
        timeout check 10s
        # Enable HTTP connection reuse on the back end. HAProxy can process more requests with fewer connections.
        option http-server-close
        # Default health check option (can be overridden per backend)
        # option redispatch # Recommended: try another server if the chosen one fails
        # balance roundrobin # Default balancing algorithm

  frontend: |
    frontend http-in
        bind *:8080 # Internal port the container listens on

        # --- Capture Request Headers for Logging/Use ---
        capture request header traceparent len 55
        capture request header baggage len 256    
        http-request set-var(txn.req_host) req.hdr(Host)
        
        # --- Generate Trace Context if not present ---
        # If no traceparent header exists, generate one
        acl has_traceparent req.hdr(traceparent) -m found
        http-request set-header traceparent "00-%[uuid]%[uuid]-%[uuid]-01" if ! has_traceparent

        # --- Set Response Header using the captured variable ---
        # This header will be added to all responses going through this frontend
        http-response set-header X-HAProxy-Seen-Host %[var(txn.req_host)]

        # --- Rate Limiting ---
        stick-table type ip size 1m expire 10m store http_req_rate(10s)
        http-request track-sc0 src
        http-request deny status 429 if { sc0_http_req_rate() gt 20 }

        # --- ACLs for Routing based on Host Header ---
        # Now use the *variable* if you prefer, or stick to req.hdr for ACLs (usually fine here)
        # ACLs are evaluated during the request phase, so req.hdr(host) is fine for them.
        acl host_cms hdr(host) -i cms.example.com
        acl host_api_gw hdr(host) -i api.example.com

        # Block health check endpoints
        acl path_api_gw_health path_beg /health
        acl path_strapi_health path_beg /_health

        http-request deny status 404 if host_api_gw path_api_gw_health or host_cms path_strapi_health

        # --- Use Backends based on ACLs ---
        use_backend cms_backend if host_cms
        use_backend api_gateway_backend if host_api_gw

        # Default backend if no host matches
        default_backend deny_backend

  # -- Backend definitions pointing to your internal K8s services
  backends:
    # Strapi Backend
    - name: cms_backend
      servers:
        - name: strapi1
          address: cms.cms.svc.cluster.local
          port: 80
          config: |
            option httpchk GET /_health HTTP/1.1
            http-check expect status 204
            inter 10s
            rise 2
            fall 3
            # Forward tracing headers
            http-request set-header traceparent %[req.hdr(traceparent)]
            http-request set-header tracestate %[req.hdr(tracestate)]
            http-request set-header baggage %[req.hdr(baggage)]

    # API Gateway Backend
    - name: api_gateway_backend
      servers:
        - name: apigw1
          address: api-gateway-go.api-gateway.svc.cluster.local
          port: 8080
          config: |
            option httpchk GET /health HTTP/1.1
            http-check expect status 200-299
            inter 10s
            rise 2
            fall 3
            # Forward tracing headers
            http-request set-header traceparent %[req.hdr(traceparent)]
            http-request set-header tracestate %[req.hdr(tracestate)]
            http-request set-header baggage %[req.hdr(baggage)]

    # Deny Backend (No health check needed)
    - name: deny_backend
      config: |
        http-request deny deny_status 403

# -- Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}
