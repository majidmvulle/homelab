apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secrets
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: grafana-admin-secrets
    creationPolicy: Owner

  dataFrom:
  - extract:
      key: grafana-admin-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-node-exporter-credentials
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: external-node-exporter-credentials
    creationPolicy: Owner

  dataFrom:
  - extract:
      key: external-node-exporter-credentials
