image:
  repository: registry.gitlab.com/gitlab-ci-utils/curl-jq
  tag: "3.2.3"
schedule: "*/5 * * * *"
cloudflare:
  config:
    - zoneId: "<your-cloudflare-zone-id>"
      records:
        - "vpn.example.com"
securityContext:
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 50m
    memory: 64Mi
