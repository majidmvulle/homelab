apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-internal-wildcard
  namespace: networking
spec:
  secretName: homelab-internal-wildcard-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  commonName: "*.homelab.internal"
  duration: 8760h   # 1 year
  renewBefore: 720h # Renew 30 days before expiry
  dnsNames:
    - "*.homelab.internal"
    - "homelab.internal"
  privateKey:
    algorithm: RSA
    size: 2048
