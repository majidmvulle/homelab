apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secrets
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: minio-secrets
    creationPolicy: Owner

  data:
    - secretKey: rootUser
      remoteRef:
        key: minio-secrets
        property: root-user
    - secretKey: rootPassword
      remoteRef:
        key: minio-secrets
        property: root-password
