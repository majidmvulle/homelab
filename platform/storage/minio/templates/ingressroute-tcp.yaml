apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minio-api-tcp
  namespace: storage
spec:
  entryPoints:
    - minioapi
  routes:
    - match: HostSNI(`minio.homelab.internal`)
      services:
        - name: minio
          port: 9000
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: minio-console-tcp
  namespace: storage
spec:
  entryPoints:
    - minioconsole
  routes:
    - match: HostSNI(`minio.homelab.internal`)
      services:
        - name: minio-console
          port: 9001
  tls: {}
