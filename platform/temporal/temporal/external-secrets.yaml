apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-password
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: temporal-password
    creationPolicy: Owner

  data:
    - secretKey: password
      remoteRef:
        key: temporal-secrets
        property: db-password
