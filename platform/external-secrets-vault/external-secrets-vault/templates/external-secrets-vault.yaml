# 1. The "Hub" namespace where you will manually create secrets
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-vault
---
# 2. Service Account for ESO to use within the Hub namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-store-reader
  namespace: external-secrets-vault
---
# 3. Role granting read-only access to secrets in the Hub
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-store-reader-role
  namespace: external-secrets-vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
# 4. Role Binding to grant the Service Account the read-only Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-store-reader-binding
  namespace: external-secrets-vault
subjects:
- kind: ServiceAccount
  name: external-secrets-store-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-store-reader-role
---
# 5. The ClusterSecretStore that tells ESO how to access the Hub
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-k8s-store
spec:
  provider:
    kubernetes:
      remoteNamespace: external-secrets-vault
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          key: "ca.crt"
          namespace: kube-system
      # The Service Account in the "Hub" namespace that ESO will impersonate
      auth:
        serviceAccount:
          name: "external-secrets-store-reader"
          namespace: "external-secrets-vault"
