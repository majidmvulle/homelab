apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-secret
  namespace: cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-k8s-store
  target:
    name: valkey-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: valkey-secret
