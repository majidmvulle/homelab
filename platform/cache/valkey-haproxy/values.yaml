replicaCount: 2

image:
  repository: haproxy
  pullPolicy: IfNotPresent
  tag: "3.4.6"

nameOverride: "valkey-haproxy"
fullnameOverride: "valkey-haproxy"

containerPort: 6379

service:
  type: ClusterIP
  portName: redis
  port: 6379

ingress:
  enabled: false

autoscaling:
  enabled: false

extraEnv:
  - name: VALKEY_PASSWORD
    valueFrom:
      secretKeyRef:
        name: valkey-secret
        key: password

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  templateVariables:
    - placeholder: __VALKEY_PASSWORD__
      envVar: VALKEY_PASSWORD
  global: |
    global
        log stdout format raw local0 info
        maxconn 2048

  defaults: |
    defaults
        log global
        mode tcp
        option tcplog
        timeout connect 5s
        timeout client 5m
        timeout server 5m
        timeout check 5s

  frontend: |
    frontend redis-writer
        bind *:6379
        mode tcp
        default_backend valkey_primary_backend

  backends:
    - name: valkey_primary_backend
      config: |
        mode tcp
        balance first
        option tcp-check
        # Keep failover reasonably fast, but avoid flapping the writer on a single failed probe.
        default-server inter 2s fastinter 1s downinter 1s rise 2 fall 3 on-marked-down shutdown-sessions
        tcp-check connect
        tcp-check send AUTH\ __VALKEY_PASSWORD__\r\n
        tcp-check expect string +OK
        tcp-check send INFO\ replication\r\n
        tcp-check expect string role:master
        tcp-check send QUIT\r\n
        tcp-check expect string +OK
        server valkey-0 valkey-0.valkey-headless.{{ .Release.Namespace }}.svc.cluster.local:6379 check
        server valkey-1 valkey-1.valkey-headless.{{ .Release.Namespace }}.svc.cluster.local:6379 check
        server valkey-2 valkey-2.valkey-headless.{{ .Release.Namespace }}.svc.cluster.local:6379 check
