---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
# PV for Node 1 (mini01.homelab.internal)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv-postgres-main-1
  labels:
    type: local
spec:
  capacity:
    storage: 100Gi # Adjust based on your NVMe size
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/k8s-local-storage/postgres-main-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - mini01.homelab.internal

