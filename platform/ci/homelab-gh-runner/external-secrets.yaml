apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-gh-runner-secret
  namespace: ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: homelab-gh-runner-secret
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: github_token
      remoteRef:
        key: homelab-gh-runner-secret
        property: github_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-image-pull-secret
  namespace: ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: ghcr-image-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }

  data:
    - secretKey: username
      remoteRef:
        key: argocd-repo-ghcr-org-repo-secret
        property: username
    - secretKey: password
      remoteRef:
        key: argocd-repo-ghcr-org-repo-secret
        property: password
