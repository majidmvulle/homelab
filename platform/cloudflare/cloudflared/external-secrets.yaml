apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-secret
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: cloudflared-tunnel-secret
