apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-org-repo-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: argocd-repo-ghcr-org-repo-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        url: "ghcr.io/your-org/charts"
        name: "Org GHCR Charts"
        type: "helm"
        enableOCI: "true"
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    # Map the dynamic values from your Vault
    - secretKey: username
      remoteRef:
        key: argocd-repo-ghcr-org-repo-secret
        property: username
    - secretKey: password
      remoteRef:
        key: argocd-repo-ghcr-org-repo-secret
        property: password

