apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-credentials
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore
  target:
    name: longhorn-backup-credentials
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        # Use Garage's native S3 API endpoint directly to avoid
        # reverse-proxy header rewriting (Expect) that breaks signed uploads.
        AWS_ENDPOINTS: "http://synology01.homelab.internal:3900"
        AWS_CERT: "{{ .ca_crt | trim }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: longhorn-backup-s3-secrets
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: longhorn-backup-s3-secrets
        property: secret_access_key
    - secretKey: ca_crt
      remoteRef:
        key: backup-s3-ca
        property: ca_crt
