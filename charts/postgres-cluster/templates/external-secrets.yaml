apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-secrets
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: minio-secrets
    creationPolicy: Owner

  dataFrom:
  - extract:
      key: minio-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-secret
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .Values.ghcrSecret.registry }}": {
                "auth": "{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"
              }
            }
          }

  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.ghcrSecret.sourceKey }}
        property: {{ .Values.ghcrSecret.usernameProperty }}
    - secretKey: password
      remoteRef:
        key: {{ .Values.ghcrSecret.sourceKey }}
        property: {{ .Values.ghcrSecret.passwordProperty }}
