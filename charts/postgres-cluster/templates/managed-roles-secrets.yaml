{{- if .Values.managedRoles }}
{{- range .Values.managedRoles }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}-password
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .secretStore.name }}
    kind: {{ .secretStore.kind }}
  target:
    name: {{ .name }}-password
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- if .passwordMapping }}
    template:
      data:
        username: {{ .roleName | quote }}
        password: "{{`{{ .`}}{{ .passwordMapping.targetKey }}{{` }}`}}"
    {{- end }}
  {{- if .passwordMapping }}
  dataFrom:
    - extract:
        key: {{ .passwordMapping.secretKey }}
      {{- if .passwordMapping.sourceKey }}
      rewrite:
        - regexp:
            source: {{ .passwordMapping.sourceKey | quote }}
            target: {{ .passwordMapping.targetKey | quote }}
      {{- end }}
  {{- else }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .passwordSecret.key }}
        property: {{ .passwordSecret.property }}
  {{- end }}
{{- end }}
{{- end }}
