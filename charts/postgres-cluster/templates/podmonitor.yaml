{{- if .Values.monitoring.enablePodMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "postgres-cluster.fullname" . }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "postgres-cluster.fullname" . }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
{{- end}}
