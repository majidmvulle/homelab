external-dns:
  image:
    tag: "v0.20.0"

  provider: rfc2136
  registry: txt
  policy: sync

  sources:
    - service
    - ingress

  # Only process services with the annotation:
  # external-dns.alpha.kubernetes.io/hostname
  filter-by-service-annotation: true

  domainFilters:
    - homelab.internal

  interval: 1m

  # --- RBAC Configuration (Handles ClusterRole & Binding) ---
  rbac:
    create: true

  serviceAccount:
    create: true
    name: external-dns

  # --- OPNsense os-bind RFC2136 Configuration ---
  extraArgs:
    - --rfc2136-host=10.0.0.1
    - --rfc2136-port=53530
    - --rfc2136-zone=homelab.internal
    - --rfc2136-tsig-keyname=rndc-key
    - --rfc2136-tsig-secret=$(EXTERNAL_DNS_RFC2136_TSIG_SECRET)
    - --rfc2136-tsig-secret-alg=hmac-sha256
    - --rfc2136-tsig-axfr
    - --txt-owner-id=homelab-k3s
    - --txt-prefix=external-dns-

  env:
    - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
      valueFrom:
        secretKeyRef:
          name: external-dns-rfc2136
          key: secret
