apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "haproxy.fullname" . }}-test-connection"
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: tcp-check
      image: busybox
      command: ['sh', '-c']
      args: ['nc -z -w 5 {{ include "haproxy.fullname" . }} {{ .Values.service.port }}']
  restartPolicy: Never
