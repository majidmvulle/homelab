apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterStore }}
    kind: ClusterSecretStore
  target:
    name: affine-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: affine-secrets
