image:
  repository: blampe/lidarr
  tag: "" # Use appVersion in Chart.yaml to update the tag version.
  pullPolicy: IfNotPresent

# Security Fix: Pin init container image
initContainer:
  image:
    repository: busybox
    tag: 1.38.0
    pullPolicy: IfNotPresent

replicaCount: 1
deploymentStrategy: {}
fullnameOverride: "lidarr"
nameOverride: ""

lidarr:
  port: 8686

env:
  TZ: "Asia/Dubai"
  PUID: 1000
  PGID: 1000

service:
  type: ClusterIP
  port: 8686

ingress:
  enabled: false
  ingressClassName: traefik
  host: lidarr.homelab.internal
  annotations: {}
  tls:
    enabled: true

persistence:
  config:
    storageClass: "longhorn-persistent"
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /config
    annotations:
      # Prevent Helm uninstall from deleting this PVC
      helm.sh/resource-policy: keep
      # Prevent Argo CD from pruning/deleting this PVC
      argocd.argoproj.io/sync-options: Prune=false

  media:
    storageClass: "longhorn-persistent-rwx"
    accessMode: ReadWriteMany
    size: 100Gi
    mountPath: /data/media
    annotations:
      # Prevent Helm uninstall from deleting this PVC
      helm.sh/resource-policy: keep
      # Prevent Argo CD from pruning/deleting this PVC
      argocd.argoproj.io/sync-options: Prune=false
  downloads:
    accessMode: ReadWriteMany
    size: 50Gi
    mountPath: /data/downloads
    annotations:
      # Prevent Helm uninstall from deleting this PVC
      helm.sh/resource-policy: keep
      # Prevent Argo CD from pruning/deleting this PVC
      argocd.argoproj.io/sync-options: Prune=false
    nfs:
      path: /volume1/k3s/data/downloads
      server: synology01.homelab.internal
      readOnly: false

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 768Mi

podSecurityContext:
  fsGroup: 1000 # Match PGID
