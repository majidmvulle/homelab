apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-server-pvc
  labels:
    app: nfs-server
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
