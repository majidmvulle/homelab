apiVersion: v1
kind: Service
metadata:
  name: nfs-server-service
  labels:
    app: nfs-server
spec:
  type: {{ .Values.service.type }}
  clusterIP: {{.Values.service.clusterIP}}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: nfs
      protocol: TCP
      name: nfs
  selector:
    app: nfs-server
