apiVersion: v1
kind: Pod
metadata:
  name: nfs-server-test-connection
  labels:
    app: nfs-server
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: nc
      image: busybox:1.36.1
      command: ['nc']
      args: ['-z', '-v', '-w5', 'nfs-server-service', '{{ .Values.service.port }}']
  restartPolicy: Never
