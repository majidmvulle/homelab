apiVersion: v1
kind: Service
metadata:
  name: {{ include "syncthing.fullname" . }}
  labels:
    {{- include "syncthing.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - port: {{ .Values.service.ports.webUI }}
      targetPort: http-ui
      protocol: TCP
      name: http-ui
    - port: {{ .Values.service.ports.syncTCP }}
      targetPort: sync-tcp
      protocol: TCP
      name: sync-tcp
    - port: {{ .Values.service.ports.syncUDP }}
      targetPort: sync-udp
      protocol: UDP
      name: sync-udp
    - port: {{ .Values.service.ports.discovery }}
      targetPort: discovery
      protocol: UDP
      name: discovery
  selector:
    {{- include "syncthing.selectorLabels" . | nindent 4 }}
