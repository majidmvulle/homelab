{{- if .Values.smtpIngress.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "mailpit.fullname" . }}-smtp
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.smtpIngress.entryPoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        - name: {{ include "mailpit.fullname" . }}
          port: smtp
{{- end }}
