apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sonarr.fullname" . }}
  labels:
    {{- include "sonarr.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.deploymentStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sonarr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sonarr.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sonarr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.sonarr.port }}
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "{{ .Values.env.TZ }}"
            - name: PUID
              value: "{{ .Values.env.PUID }}"
            - name: PGID
              value: "{{ .Values.env.PGID }}"
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.persistence.config.mountPath }}
            - name: media-volume
              mountPath: {{ .Values.persistence.media.mountPath }}
            - name: downloads-volume
              mountPath: {{ .Values.persistence.downloads.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: {{ include "sonarr.fullname" . }}-config-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: {{ include "sonarr.fullname" . }}-media-pvc
        - name: downloads-volume
          persistentVolumeClaim:
            claimName: {{ include "sonarr.fullname" . }}-downloads-nfs-pvc
