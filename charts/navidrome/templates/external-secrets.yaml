apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-spotify-secrets
spec:
  secretStoreRef:
    name: cluster-k8s-store
    kind: ClusterSecretStore

  target:
    name: navidrome-spotify-secrets
    creationPolicy: Owner

  dataFrom:
  - extract:
      key: navidrome-spotify-secrets
