apiVersion: v1
kind: Service
metadata:
  name: {{ include "navidrome.fullname" .}}
  labels:
    {{- include "navidrome.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}   # External port (80)
      targetPort: {{ .Values.service.targetPort }}  # Internal port (4533)
      protocol: TCP
      name: http
  selector:
    {{- include "navidrome.selectorLabels" . | nindent 4 }}
