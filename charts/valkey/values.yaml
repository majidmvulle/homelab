# Default values for valkey chart
# This is a YAML-formatted file.

# Valkey image configuration
image:
  registry: docker.io
  repository: valkey/valkey
  tag: "8.1.11"
  pullPolicy: IfNotPresent

# Single-primary deployment. Replication and Sentinel are disabled by default
# because no in-cluster clients are currently Sentinel-aware.
sentinel:
  enabled: false
  quorum: 2

replication:
  enabled: false
  replicas: 1

# Resource limits and requests
resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# Persistence configuration
persistence:
  enabled: true
  storageClass: "longhorn-persistent"
  size: "4Gi"
  # Valkey persistence mode: rdb, aof, or both
  mode: "both"

# Security configuration
auth:
  enabled: true
  # Password will be read from existing secret
  existingSecret: "valkey-secret"
  existingSecretPasswordKey: "password"

# Service configuration
service:
  type: ClusterIP
  port: 6379
  # Headless service is still used for stable StatefulSet network identity.
  headless:
    enabled: true

# Valkey configuration
valkeyConfig:
  # Maximum memory policy
  maxmemory: "400mb"
  maxmemoryPolicy: "allkeys-lru"
  # Replication configuration
  replicaReadOnly: "yes"
  # Persistence configuration
  save: "900 1 300 10 60 10000"
  appendonly: "yes"
  appendfsync: "everysec"

# Sentinel configuration (only used when sentinel.enabled=true)
sentinelConfig:
  # Sentinel port
  port: 26379
  # Quorum for failover decisions
  quorum: 2
  # Failover timeout
  downAfterMilliseconds: 5000
  failoverTimeout: 60000
  parallelSyncs: 1

# Pod configuration
podAnnotations: {}
podSecurityContext:
  fsGroup: 999
  runAsUser: 999
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Probes configuration
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}
