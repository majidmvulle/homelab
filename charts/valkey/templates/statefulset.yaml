apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "valkey.fullname" . }}-headless
  replicas: {{ .Values.replication.replicas }}
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "valkey.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: valkey
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/sh
          - /scripts/start-valkey.sh
        env:
        {{- if .Values.auth.enabled }}
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "valkey.secretName" . }}
              key: {{ include "valkey.secretPasswordKey" . }}
        {{- end }}
        ports:
        - name: valkey
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              valkey-cli {{- if .Values.auth.enabled }} -a "$VALKEY_PASSWORD" {{- end }} ping | grep -q PONG
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - |
              valkey-cli {{- if .Values.auth.enabled }} -a "$VALKEY_PASSWORD" {{- end }} ping | grep -q PONG
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/valkey
        - name: scripts
          mountPath: /scripts
      {{- if .Values.sentinel.enabled }}
      - name: sentinel
        image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/sh
          - /scripts/start-sentinel.sh
        env:
        {{- if .Values.auth.enabled }}
        - name: VALKEY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "valkey.secretName" . }}
              key: {{ include "valkey.secretPasswordKey" . }}
        {{- end }}
        ports:
        - name: sentinel
          containerPort: {{ .Values.sentinelConfig.port }}
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: sentinel-config
          mountPath: /etc/valkey
        - name: scripts
          mountPath: /scripts
      {{- end }}
      volumes:
      - name: config
        configMap:
          name: {{ include "valkey.fullname" . }}-config
          items:
          - key: valkey.conf
            path: valkey.conf
      {{- if .Values.sentinel.enabled }}
      - name: sentinel-config
        configMap:
          name: {{ include "valkey.fullname" . }}-config
          items:
          - key: sentinel.conf
            path: sentinel.conf
      {{- end }}
      - name: scripts
        configMap:
          name: {{ include "valkey.fullname" . }}-config
          defaultMode: 0755
          items:
          - key: start-valkey.sh
            path: start-valkey.sh
          {{- if .Values.sentinel.enabled }}
          - key: start-sentinel.sh
            path: start-sentinel.sh
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        {{- include "valkey.selectorLabels" . | nindent 8 }}
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
  {{- end }}
